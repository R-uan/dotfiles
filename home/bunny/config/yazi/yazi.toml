[mgr]
ratio          = [2, 3, 3]   # Panel width ratios (parent:current:preview)
linemode       = "size"
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true
show_symlink   = true
scrolloff      = 5

[preview]
tab_size      = 2
max_width     = 800
max_height    = 1000
image_filter  = "lanczos3"
image_quality = 85

# %s = selected paths, %s1 = the first one (yazi 26 replaced "$@" / "$1").
[opener]
extract = [
  { run = 'unar %s1', desc = "Extract (unar)" },
]
play = [
  { run = 'vlc %s', orphan = true, desc = "Play with VLC" },
]
edit = [
  { run = 'nvim %s', block = true, desc = "Open in Neovim" },
  { run = 'code %s', orphan = true, desc = "Open in VSCode" },
  { run = 'zeditor %s', orphan = true, desc = "Open in Zed" },
]
open = [
  { run = 'xdg-open %s1', orphan = true, desc = "Open" },
]
open_browser = [
  { run = 'xdg-open %s1', orphan = true, desc = "Open in browser" },
]
view_image = [
  { run = 'xdg-open %s1', orphan = true, desc = "Open in default viewer" },
  { run = 'krita %s', orphan = true, desc = "Open in Krita" },
]
run_exe = [
  { run = 'wine %s1', orphan = true, desc = "Run with Wine" },
  { run = 'steam-run %s1', orphan = true, desc = "Run with steam-run" },
]
run_sh = [
  { run = 'bash %s1; printf "\n[exit %%s, press enter]" $?; read _', block = true, desc = "Run in terminal" },
]
reveal = [
  { run = 'xdg-open %d1', orphan = true, desc = "Open containing folder" },
]

[open]
rules = [
  # HTML — edit or view in browser
  { mime = "text/html",                   use = ["edit", "open_browser"] },
  { url = "*.{html,htm}",                 use = ["edit", "open_browser"] },

  # Scripts — edit or run (before text/*, which would catch them first)
  { url = "*.sh",                         use = ["edit", "run_sh"] },

  # Web/text formats — editor only
  { url = "*.{css,scss,sass,less,js,ts,jsx,tsx,json,xml,yaml,yml,toml,md,nix,lua,qml}", use = "edit" },
  { url = "*.svg",                        use = ["edit", "view_image"] },

  # Generic text fallback
  { mime = "text/*",                      use = "edit" },
  { mime = "inode/empty",                 use = "edit" },

  # Documents & archives
  { mime = "application/pdf",             use = ["open_browser", "reveal"] },
  { mime = "application/{zip,rar,vnd.rar,gzip,x-tar,x-xz,x-bzip2,x-7z-compressed,zstd,x-zstd}", use = "extract" },

  # Images — default viewer or Krita
  { mime = "image/*",                     use = ["view_image", "reveal"] },

  # Media
  { mime = "{audio,video}/*",             use = ["play", "reveal"] },

  # Windows executables
  { url = "*.exe",                        use = "run_exe" },
  { mime = "application/{x-dosexec,x-ms-dos-executable,vnd.microsoft.portable-executable}", use = "run_exe" },

  # Anything else
  { url = "*",                            use = ["open", "reveal"] },
]
